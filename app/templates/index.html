<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taskboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main>
      <h1>Taskboard</h1>
      <p class="version">Version {{ version }}</p>

      <form id="new-task">
        <input
          id="title"
          name="title"
          placeholder="Neue Aufgabe…"
          maxlength="200"
          required
          autocomplete="off"
        />
        <button type="submit">Hinzufügen</button>
      </form>

      <p id="error" class="error" hidden></p>
      <ul id="tasks"></ul>
    </main>

    <script>
      const list = document.getElementById("tasks");
      const errorBox = document.getElementById("error");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
      }

      async function api(path, options) {
        const response = await fetch(path, options);
        if (!response.ok && response.status !== 204) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${response.status}`);
        }
        return response.status === 204 ? null : response.json();
      }

      function render(tasks) {
        list.replaceChildren();
        for (const task of tasks) {
          const item = document.createElement("li");
          if (task.done) item.classList.add("done");

          const toggle = document.createElement("input");
          toggle.type = "checkbox";
          toggle.checked = task.done;
          toggle.addEventListener("change", () => update(task.id, toggle.checked));

          // textContent, not innerHTML: otherwise the title would be an XSS vector.
          const label = document.createElement("span");
          label.textContent = task.title;

          const remove = document.createElement("button");
          remove.textContent = "Löschen";
          remove.addEventListener("click", () => destroy(task.id));

          item.append(toggle, label, remove);
          list.append(item);
        }
      }

      async function refresh() {
        try {
          render(await api("/api/tasks"));
          errorBox.hidden = true;
        } catch (err) {
          showError(err.message);
        }
      }

      async function update(id, done) {
        try {
          await api(`/api/tasks/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ done }),
          });
          await refresh();
        } catch (err) {
          showError(err.message);
        }
      }

      async function destroy(id) {
        try {
          await api(`/api/tasks/${id}`, { method: "DELETE" });
          await refresh();
        } catch (err) {
          showError(err.message);
        }
      }

      document.getElementById("new-task").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = document.getElementById("title");
        try {
          await api("/api/tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: input.value }),
          });
          input.value = "";
          await refresh();
        } catch (err) {
          showError(err.message);
        }
      });

      refresh();
    </script>
  </body>
</html>
